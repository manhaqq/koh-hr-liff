<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ผังองค์กร | โก๋ในซอย HR Hub</title>
<link rel="stylesheet" href="app.css">
<style>
  /* ---------- ผังองค์กร ---------- */
  .node{
    background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:10px 12px;box-shadow:var(--shadow-sm);position:relative;
  }
  .node.me{border-color:var(--primary);border-width:2px;box-shadow:0 0 0 3px rgba(15,81,50,.09)}
  .node .role{font-size:11px;color:var(--accent);font-weight:700;line-height:1.35}
  .node .nm{font-size:14.5px;font-weight:600;line-height:1.4;margin-top:1px}
  .node .sub{font-size:11.5px;color:var(--sub);margin-top:2px}
  .node .flag{
    position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;
    background:var(--primary);color:#fff;border-radius:20px;padding:2px 8px;
  }
  .branch{margin-left:14px;padding-left:14px;border-left:2px solid var(--line)}
  .branch > *{margin-top:9px}
  .lvl{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--sub);
       text-transform:uppercase;margin:20px 0 8px}
  .deptcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);
            padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .deptcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .deptcard .hd .t{font-size:15px;font-weight:700}
  .deptcard .hd .c{font-size:12px;color:var(--sub);flex:0 0 auto}
  .plist{margin:10px 0 0;padding:0;list-style:none}
  .plist li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .plist li:last-child{border-bottom:0}
  .plist li .p{color:var(--sub);font-size:11.5px;flex:0 0 auto;max-width:44%;text-align:right;margin-left:auto}
  .plist li.hd2{font-weight:700;color:var(--primary)}
  .plist li.mine{background:#F2F7F4;border-radius:6px;padding-left:6px;padding-right:6px}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="badge">🏢 โครงสร้างองค์กร</div>
    <h1>ผังองค์กร</h1>
    <p id="sub">ใครเป็นหัวหน้าใคร เรื่องนี้ต้องคุยกับใคร</p>
  </div>
</div>

<div class="wrap pull-up">
  <div id="topArea"></div>
  <div id="content"><div class="loading"><div class="spinner"></div><div>กำลังโหลดผังองค์กร...</div></div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let NODES = [], DEPTS = [], PDF = '', MYCODE = '', MYDEPT = '', VIEW = 'tree', Q = '', WARN = '';

(async function () {
  try {
    await initLiff('org');
    const r = await api('org_chart');
    if (!r.ok) return showError('#content', r.message || 'โหลดผังองค์กรไม่สำเร็จ', true);
    NODES  = r.nodes || [];
    DEPTS  = r.depts || [];
    PDF    = r.pdfUrl || '';
    MYCODE = r.myEmpCode || '';
    MYDEPT = r.myDept || '';
    WARN   = r.warning || '';
    $('#sub').textContent = `พนักงาน ${r.total} คน · ${DEPTS.length} แผนก`;
    /* ถ้าข้อมูลผิดปกติ บอกให้ชัด ดีกว่าปล่อยให้เห็นกล่องเปล่าเรียงกันเป็นสิบ */
    if (WARN && !NODES.some(n => n.name)) {
      return showError('#content', WARN, true);
    }
    render();
  } catch (e) { bootFail(e); }
})();

/* ---------- โครงหน้า ---------- */
function render() {
  $('#topArea').innerHTML = `
    <div class="search"><input type="text" id="q" placeholder="พิมพ์ชื่อเพื่อน ตำแหน่ง หรือแผนก" value="${esc(Q)}"></div>
    <div class="chips">
      <button class="chip ${VIEW === 'tree' ? 'active' : ''}" data-v="tree">🌳 สายบังคับบัญชา</button>
      <button class="chip ${VIEW === 'dept' ? 'active' : ''}" data-v="dept">🏬 รายแผนก</button>
      <button class="chip ${VIEW === 'me' ? 'active' : ''}" data-v="me">📍 สายงานของฉัน</button>
    </div>`;
  $$('#topArea .chip').forEach(b => b.onclick = () => { VIEW = b.dataset.v; render(); });
  const q = $('#q');
  q.oninput = () => { Q = q.value.trim(); draw(); };
  draw();
  if (Q) { q.focus(); q.setSelectionRange(Q.length, Q.length); }
}

function draw() {
  if (WARN) {
    $('#content').innerHTML = `<div class="alert err" style="margin-bottom:12px">⚠️ ${esc(WARN)}</div>`;
    if (!NODES.some(n => n.name)) return;
  }
  if (Q) return drawSearch();
  if (VIEW === 'dept') return drawDept();
  if (VIEW === 'me')   return drawMe();
  drawTree();
}

/* ---------- ค้นหา ---------- */
function drawSearch() {
  const q = Q.toLowerCase();
  const hits = NODES.filter(n =>
    [n.name, n.nickname, n.titleTh, n.titleEn, n.dept, n.empCode]
      .join(' ').toLowerCase().includes(q));

  if (!hits.length) {
    return showEmpty('#content', '🔍', 'ไม่พบชื่อนี้ในผังองค์กร',
      'ลองพิมพ์แค่ชื่อต้น หรือชื่อแผนก เช่น “ครัวเช้า”');
  }
  $('#content').innerHTML =
    `<div class="eyebrow" style="margin:4px 4px 8px">ผลการค้นหา ${hits.length} รายการ</div>` +
    hits.slice(0, 60).map(n => nodeCard(n, true)).join('');
}

/* ---------- มุมมองสายบังคับบัญชา ---------- */
function drawTree() {
  const roots = NODES.filter(n => !n.parentId).sort(byOrder);
  const warnHtml = WARN ? `<div class="alert err" style="margin-bottom:12px">⚠️ ${esc(WARN)}</div>` : '';
  const html = roots.map(n => subtree(n, 0)).join('');
  $('#content').innerHTML = warnHtml + html + legend();
  bindToggles();
}

function subtree(n, depth) {
  const kids = NODES.filter(x => x.parentId === n.nodeId).sort(byOrder);
  /* ระดับสมาชิกแผนกมีคนเยอะ — ยุบไว้ก่อนแล้วให้กดเปิด */
  if (kids.length > 4 && depth >= 2) {
    return nodeCard(n) + `
      <div class="branch">
        <details class="acc"><summary>ทีมงานในสังกัด ${kids.length} คน</summary>
          <div class="body" style="white-space:normal;padding-top:4px">
            ${kids.map(k => nodeCard(k)).join('')}
          </div>
        </details>
      </div>`;
  }
  return nodeCard(n) + (kids.length
    ? `<div class="branch">${kids.map(k => subtree(k, depth + 1)).join('')}</div>` : '');
}

function nodeCard(n, showDept) {
  const mine = n.empCode && n.empCode === MYCODE;
  const title = n.titleTh + (n.titleEn ? ` · ${n.titleEn}` : '');
  return `<div class="node ${mine ? 'me' : ''}" style="margin-bottom:9px">
    ${mine ? '<div class="flag">คุณอยู่ตรงนี้</div>' : ''}
    <div class="role">${esc(title)}</div>
    <div class="nm">${esc(n.name || '— ยังไม่ได้ระบุชื่อ —')}${n.nickname ? ` <span class="muted">(${esc(n.nickname)})</span>` : ''}</div>
    ${showDept !== false && n.dept ? `<div class="sub">แผนก${esc(n.dept)}</div>` : ''}
  </div>`;
}

function legend() {
  return `<div class="card flat" style="margin-top:16px">
    <div class="eyebrow">อ่านผังนี้ยังไง</div>
    <p class="tiny" style="margin:0">
      กล่องที่เยื้องเข้าไปทางขวา = อยู่ใต้สายบังคับบัญชาของกล่องด้านบน<br>
      กรอบเขียว = ตำแหน่งของคุณเอง · กดแถบ “ทีมงานในสังกัด” เพื่อดูรายชื่อทั้งหมด
    </p>
    ${PDF ? `<div class="btn-row" style="margin-top:10px">
      <a class="btn sm ghost" href="${esc(PDF)}" target="_blank" rel="noopener">📄 เปิดผังองค์กรฉบับเต็ม (PDF)</a>
    </div>` : ''}
  </div>`;
}

/* ---------- มุมมองรายแผนก ---------- */
function drawDept() {
  const byDept = {};
  NODES.forEach(n => {
    const d = n.dept || 'ไม่ระบุแผนก';
    (byDept[d] = byDept[d] || []).push(n);
  });
  const order = Object.keys(byDept).sort((a, b) => {
    if (a === MYDEPT) return -1;
    if (b === MYDEPT) return 1;
    return byDept[b].length - byDept[a].length;
  });

  const warnHtml = WARN ? `<div class="alert err" style="margin-bottom:12px">⚠️ ${esc(WARN)}</div>` : '';
  $('#content').innerHTML = warnHtml + order.map(d => {
    const list = byDept[d].slice().sort((a, b) => a.level - b.level || byOrder(a, b));
    return `<div class="deptcard">
      <div class="hd">
        <div class="t">${esc(d)}${d === MYDEPT ? ' <span class="tag green">แผนกของคุณ</span>' : ''}</div>
        <div class="c">${list.length} คน</div>
      </div>
      <ul class="plist">
        ${list.map(n => `<li class="${n.level <= 4 ? 'hd2' : ''} ${n.empCode === MYCODE ? 'mine' : ''}">
          <span>${esc(n.name || '—')}${n.empCode === MYCODE ? ' ← คุณ' : ''}</span>
          <span class="p">${esc(n.titleTh)}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }).join('') + legend();
}

/* ---------- สายงานของฉัน ---------- */
function drawMe() {
  const me = NODES.filter(n => n.empCode === MYCODE)[0];
  if (!me) {
    return showEmpty('#content', '🤔', 'ยังไม่พบตำแหน่งของคุณในผังองค์กร',
      'แจ้ง HR เพื่อเพิ่มชื่อคุณลงในผัง — กดเมนู “ติดต่อ HR” ได้เลย');
  }
  /* ไล่ขึ้นไปหาหัวหน้าตามลำดับ */
  const chain = [];
  let cur = me, guard = 0;
  while (cur && cur.parentId && guard++ < 12) {
    const up = NODES.filter(n => n.nodeId === cur.parentId)[0];
    if (!up) break;
    chain.unshift(up);
    cur = up;
  }
  const peers = NODES.filter(n => n.parentId === me.parentId && n.nodeId !== me.nodeId).sort(byOrder);
  const kids  = NODES.filter(n => n.parentId === me.nodeId).sort(byOrder);
  const boss  = chain.length ? chain[chain.length - 1] : null;

  $('#content').innerHTML = `
    <div class="card">
      <div class="eyebrow">มีเรื่องต้องคุย เริ่มที่นี่</div>
      ${boss ? `<div class="kv"><span class="k">หัวหน้าโดยตรง</span><span class="v">${esc(boss.name || boss.titleTh)}</span></div>` : ''}
      <div class="kv"><span class="k">ตำแหน่งของคุณ</span><span class="v">${esc(me.titleTh)}</span></div>
      <div class="kv"><span class="k">แผนก</span><span class="v">${esc(me.dept || '-')}</span></div>
      <p class="tiny" style="margin:12px 0 0">
        เรื่องงานประจำวัน ตารางกะ และการขอสลับกะ → คุยกับหัวหน้าโดยตรงก่อน<br>
        เรื่องเงินเดือน สวัสดิการ เอกสาร → เมนู “ติดต่อ HR”<br>
        เรื่องร้องเรียนที่ไม่อยากผ่านหัวหน้า → เมนู “ติดต่อ HR” แล้วเลือก “ร้องเรียน (เป็นความลับ)”
      </p>
    </div>

    ${chain.length ? `<div class="lvl">สายบังคับบัญชาเหนือคุณ</div>
      ${chain.map(n => nodeCard(n)).join('')}` : ''}

    <div class="lvl">ตำแหน่งของคุณ</div>
    ${nodeCard(me)}

    ${kids.length ? `<div class="lvl">ทีมที่คุณดูแล ${kids.length} คน</div>
      ${kids.map(n => nodeCard(n)).join('')}` : ''}

    ${peers.length ? `<div class="lvl">เพื่อนร่วมสายงาน ${peers.length} คน</div>
      ${peers.slice(0, 30).map(n => nodeCard(n)).join('')}` : ''}
    ${legend()}`;
}

function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }
function bindToggles() {}
</script>
</body>
</html>
