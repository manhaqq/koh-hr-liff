<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คู่มือและสวัสดิการ | โก๋ในซอย HR Hub</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="badge">📘 คู่มือพนักงาน</div>
    <h1>คู่มือและสวัสดิการ</h1>
    <p>ค้นหาคำตอบได้ทุกเรื่อง ตลอด 24 ชั่วโมง</p>
  </div>
</div>

<div class="wrap pull-up">
  <div id="topArea"></div>
  <div id="content"><div class="loading"><div class="spinner"></div><div>กำลังโหลดคู่มือ...</div></div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let SECTIONS = [], FAQS = [], CAT = 'ทั้งหมด', PDF = '', ORGCHART = '';

(async function () {
  try {
    await initLiff('handbook');
    const [h, f] = await Promise.all([api('handbook'), api('faq')]);
    if (!h.ok) return showError('#content', h.message, true);
    SECTIONS = h.items || [];
    PDF = h.pdfUrl || ''; ORGCHART = h.orgChartUrl || '';
    FAQS = (f.ok ? f.items : []) || [];

    const deep = decodeURIComponent(qs('cat') || '');
    if (deep && categories().includes(deep)) CAT = deep;
    render();
  } catch (e) { bootFail(e); }
})();

function categories() {
  const s = new Set();
  SECTIONS.forEach(x => { const c = (x.category || '').trim(); if (c) s.add(c); });
  FAQS.forEach(x => { const c = (x.category || '').trim(); if (c) s.add(c); });
  return ['ทั้งหมด', ...s];
}

function render() {
  $('#topArea').innerHTML = `
    <div class="search"><input type="text" id="q" placeholder="พิมพ์คำที่อยากรู้ เช่น ลาป่วย, OT, ประกันสังคม"></div>
    <div class="chips" id="chips">
      ${categories().map(c => `<button class="chip ${c === CAT ? 'active' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>`;
  $$('#chips .chip').forEach(b => b.onclick = () => { CAT = b.dataset.c; render(); });
  $('#q').oninput = draw;
  draw();
}

function draw() {
  const q = ($('#q')?.value || '').trim().toLowerCase();
  const inCat = x => CAT === 'ทั้งหมด' || (x.category || '').trim() === CAT;
  const hit = (...f) => !q || f.join(' ').toLowerCase().includes(q);

  const secs = SECTIONS.filter(x => inCat(x) && hit(x.title, x.body, x.tags));
  const faqs = FAQS.filter(x => inCat(x) && hit(x.question, x.answer));

  let html = '';

  if (!q && CAT === 'ทั้งหมด') {
    html += `<div class="card flat">
      <div class="eyebrow">เอกสารฉบับเต็ม</div>
      <div class="btn-row" style="margin-top:8px">
        ${PDF ? `<a class="btn sm" href="${esc(PDF)}" target="_blank" rel="noopener">📕 คู่มือพนักงาน (PDF)</a>` : ''}
        <a class="btn sm ghost" href="https://liff.line.me/${esc(CFGX.LIFF.org)}">🏢 ผังองค์กร</a>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <a class="btn sm" style="background:#96631A" href="https://liff.line.me/${esc(CFGX.LIFF.appguide)}">📱 คู่มือการใช้แอป myHR Cloud</a>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <a class="btn sm ghost" href="https://liff.line.me/${esc(CFGX.LIFF.reports)}">📊 รายการรายงาน</a>
      </div>
      ${!PDF ? '<p class="tiny" style="margin:6px 0 0">ยังไม่ได้อัปโหลดคู่มือฉบับ PDF — HR ใส่ลิงก์ได้ในชีต Settings (คีย์ HANDBOOK_PDF_URL)</p>' : ''}
    </div>`;
  }

  if (faqs.length) {
    html += `<div class="eyebrow" style="margin:16px 4px 8px">คำถามที่พบบ่อย (${faqs.length})</div>`;
    html += faqs.map(f => `
      <details class="acc">
        <summary>${esc(f.question)}</summary>
        <div class="body">${nl2br(f.answer)}
        ${f.linkUrl ? `<br><br><a href="${esc(f.linkUrl)}" target="_blank" rel="noopener">${esc(f.linkLabel || 'อ่านเพิ่มเติม')} →</a>` : ''}
        </div>
      </details>`).join('');
  }

  if (secs.length) {
    html += `<div class="eyebrow" style="margin:20px 4px 8px">เนื้อหาคู่มือ (${secs.length})</div>`;
    html += secs.map(s => `
      <details class="acc">
        <summary>${esc(s.title)}</summary>
        <div class="body">${nl2br(s.body)}
        ${s.fileUrl ? `<br><br><a href="${esc(s.fileUrl)}" target="_blank" rel="noopener">📎 เปิดเอกสารแนบ →</a>` : ''}
        </div>
      </details>`).join('');
  }

  if (!secs.length && !faqs.length) {
    showEmpty('#content', '🔍', 'ไม่พบเนื้อหาที่ตรงกับคำค้นหา',
      'ลองใช้คำสั้นลง หรือกดเมนู “ติดต่อ HR” เพื่อถามโดยตรง');
    return;
  }

  html += `<div class="card flat" style="margin-top:18px">
    <p class="tiny" style="margin:0">ไม่เจอสิ่งที่ต้องการ? กดเมนู <strong>ติดต่อ HR</strong> ในหน้าแชท แล้วเลือก “ขอคำปรึกษา”
    ทีม HR จะตอบภายใน 1–3 วันทำการ</p></div>`;

  $('#content').innerHTML = html;
}
</script>
</body>
</html>
